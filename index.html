<style>
  :root{
    --bg:#F5F7FA; --paper:#FFFFFF; --ink:#233044; --sub:#6B7690; --line:#E2E6EE;
    --chalk-blue:#2E5EAA; --chalk-blue-dark:#1F4482; --red-pen:#E5484D; --green-ok:#2FAE72;
    --shadow: 0 2px 10px rgba(35,48,68,0.06);
  }
  *{box-sizing:border-box;}
  #mg-root{ font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); background:var(--bg); padding:20px 16px 40px; min-height:100%; max-width:720px; margin:0 auto; }
  .mg-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .mg-title{ font-size:22px; font-weight:800; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px; }
  .mg-title .badge{ display:inline-flex; align-items:center; justify-content:center; width:30px;height:30px; border-radius:8px; background:var(--chalk-blue); color:#fff; font-size:15px; transform:rotate(-6deg); }
  .mg-teacher-badge{ font-size:12px; font-weight:700; color:var(--sub); display:flex; align-items:center; gap:8px; }
  .mg-teacher-badge a{ color:var(--chalk-blue); cursor:pointer; text-decoration:none; }
  .mg-tabs{ display:flex; gap:6px; background:var(--paper); padding:4px; border-radius:12px; box-shadow:var(--shadow); margin-bottom:14px; }
  .mg-tab{ flex:1; text-align:center; padding:10px 0; border-radius:9px; font-weight:700; font-size:14px; cursor:pointer; color:var(--sub); transition:all .15s ease; user-select:none; }
  .mg-tab.active{ background:var(--chalk-blue); color:#fff; }
  .mg-card{ background:var(--paper); border-radius:16px; padding:20px; box-shadow:var(--shadow); margin-bottom:16px; }
  .mg-card h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); }
  .mg-card h4{ margin:18px 0 10px; font-size:13px; font-weight:800; color:var(--chalk-blue); }
  .mg-card h4:first-child{ margin-top:0; }
  .mg-field{ margin-bottom:14px; }
  .mg-field label{ display:block; font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:6px; }
  .mg-field input[type=text], .mg-field input[type=number], .mg-field input[type=password]{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    font-size:15px; font-family:inherit; color:var(--ink); background:#FAFBFD;
  }
  .mg-field input:focus{ outline:none; border-color:var(--chalk-blue); }
  .mg-row{ display:flex; gap:10px; }
  .mg-row > *{ flex:1; }
  .mg-qrow{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .mg-qrow:last-child{ border-bottom:none; }
  .mg-qnum{ width:30px;height:30px; flex-shrink:0; border-radius:50%; background:var(--chalk-blue); color:#fff; font-weight:800; font-size:13px; display:flex;align-items:center;justify-content:center; }
  .mg-choice-select{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .mg-choice-btn{ width:38px;height:38px; border-radius:9px; border:1.5px solid var(--line); background:#FAFBFD; font-weight:700; font-size:14px; cursor:pointer; color:var(--ink); transition:all .12s ease; }
  .mg-choice-btn.selected{ background:var(--chalk-blue); border-color:var(--chalk-blue); color:#fff; transform:scale(1.05); }
  .mg-choice-btn:active{ transform:scale(0.94); }
  .mg-count-badge{ font-size:12px; font-weight:800; color:var(--red-pen); flex-shrink:0; margin-left:6px; }
  .mg-count-badge.done{ color:var(--green-ok); }
  .mg-pick-btn{ padding:9px 16px; border-radius:9px; border:1.5px solid var(--line); background:#FAFBFD; font-weight:700; font-size:14px; cursor:pointer; color:var(--ink); transition:all .12s ease; }
  .mg-pick-btn.selected{ background:var(--chalk-blue); border-color:var(--chalk-blue); color:#fff; }
  .mg-list-btn{ display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line); background:#FAFBFD; font-weight:700; font-size:15px; color:var(--ink); cursor:pointer; margin-bottom:10px; }
  .mg-list-btn:hover{ border-color:var(--chalk-blue); }
  .mg-list-btn .arrow{ color:var(--sub); font-weight:400; }
  .mg-btn{ display:block; width:100%; padding:13px; border:none; border-radius:12px; background:var(--chalk-blue); color:#fff; font-weight:800; font-size:15px; cursor:pointer; transition:background .15s ease; }
  .mg-btn:hover{ background:var(--chalk-blue-dark); }
  .mg-btn.secondary{ background:#fff; color:var(--chalk-blue); border:1.5px solid var(--chalk-blue); }
  .mg-btn.danger{ background:#fff; color:var(--red-pen); border:1.5px solid var(--red-pen); }
  .mg-btn.small{ display:inline-block; width:auto; padding:7px 12px; font-size:12.5px; border-radius:8px; }
  .mg-btn:disabled{ background:var(--line); color:var(--sub); cursor:not-allowed; }
  .mg-empty{ text-align:center; padding:36px 20px; color:var(--sub); font-size:14px; }
  .mg-stat-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:8px; flex-wrap:wrap; }
  .mg-stat-row:last-child{ border-bottom:none; }
  .mg-stat-name{ font-weight:700; font-size:14px; }
  .mg-stat-score{ font-size:13px; color:var(--sub); }
  .mg-pct-badge{ font-weight:800; font-size:13px; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .mg-pct-high{ background:#E7F7EF; color:var(--green-ok); }
  .mg-pct-mid{ background:#FFF6E0; color:#B8860B; }
  .mg-pct-low{ background:#FDEBEB; color:var(--red-pen); }
  .mg-item-bar-wrap{ margin-bottom:12px; }
  .mg-item-bar-label{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--sub); margin-bottom:4px; font-weight:700; }
  .mg-item-bar-track{ height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
  .mg-item-bar-fill{ height:100%; background:var(--chalk-blue); border-radius:99px; transition:width .3s ease; }
  .mg-result-screen{ text-align:center; padding:10px 0 4px; }
  .mg-result-score{ font-size:44px; font-weight:900; color:var(--chalk-blue); margin:6px 0 2px; }
  .mg-result-sub{ color:var(--sub); font-size:13px; margin-bottom:18px; }
  .mg-stamp-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(56px,1fr)); gap:10px; margin-bottom:8px; }
  .mg-stamp{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .mg-stamp-num{ font-size:10px; color:var(--sub); font-weight:700; }
  .mg-mark{ width:34px;height:34px; display:flex;align-items:center;justify-content:center; }
  .mg-mark svg{ width:100%; height:100%; }
  .mg-toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:99px; font-size:13px; font-weight:700; box-shadow:0 4px 16px rgba(0,0,0,0.2); z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease; max-width:90%; text-align:center; }
  .mg-toast.show{ opacity:1; }
  .mg-note{ font-size:12px; color:var(--sub); margin-top:6px; line-height:1.5; }
  .mg-hint{ font-size:12px; color:var(--chalk-blue); font-weight:700; margin:-6px 0 14px; }
  .mg-warn{ font-size:13px; color:var(--red-pen); font-weight:700; margin-bottom:14px; line-height:1.5; background:#FDEBEB; padding:10px 12px; border-radius:10px; }
  .mg-footer-link{ text-align:center; margin-top:26px; }
  .mg-footer-link a{ font-size:11px; color:#C7CDDA; text-decoration:none; cursor:pointer; }
  .mg-footer-link a:hover{ color:var(--sub); }
  .mg-pin-wrap{ max-width:280px; margin:40px auto 0; text-align:center; }
  .mg-pin-wrap .mg-card{ text-align:left; }
</style>

<div id="mg-root">
  <div class="mg-header">
    <div class="mg-title"><span class="badge">✓</span>수학 학습지 채점기</div>
    <div class="mg-teacher-badge" id="mg-teacher-badge"></div>
  </div>
  <div id="mg-content"></div>
</div>

<div class="mg-toast" id="mg-toast"></div>

<script>
(function(){
  const TID = 'solo'; // single-teacher use, fixed id
  const root = document.getElementById('mg-content');
  const toastEl = document.getElementById('mg-toast');
  const badgeEl = document.getElementById('mg-teacher-badge');
  const CLASSROOMS = ['국화','난초','매화','전담'];

  let mode = 'student'; // student | pin | teacher

  // student flow
  let studentStep = 'pick-worksheet'; // pick-worksheet | quiz | confirm | result
  let allWorksheets = [];
  let studentPickedGrade = '';
  let pickedWorksheet = null;
  let studentAnswers = {};
  let lastResult = null;
  let selectedClassroom = '';
  let pendingName = '', pendingClassroom = '';

  // login
  let loginPin = '';
  let showResetForm = false;
  let resetCode = '';
  let resetNewPin = '';

  // teacher session
  let loggedIn = false;
  let teacherWorksheets = [];
  let teacherTab = 'list'; // list | edit | results
  let draftKey = null;
  let resultsWorksheetId = null;

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 2200);
  }
  function sameSet(a,b){
    if(!a || !b) return false;
    if(a.length !== b.length) return false;
    const sa = [...a].sort((x,y)=>x-y);
    const sb = [...b].sort((x,y)=>x-y);
    return sa.every((v,i)=>v===sb[i]);
  }
  function genId(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // ---------- BACKEND (Google Apps Script) ----------
  const API_URL = 'https://script.google.com/macros/s/AKfycbwqAts-nDjCzBWs0Wct6QpBwpiYvyhCbOvHPFOqmlBWDy4_p1XCGUbzCuVPy8OcFJI-rQ/exec';

  async function apiGet(params){
    try{
      const qs = new URLSearchParams({...params, _ts: Date.now()+'_'+Math.random().toString(36).slice(2)}).toString();
      const res = await fetch(API_URL + '?' + qs, { cache: 'no-store' });
      return await res.json();
    }catch(e){ console.error(e); toast('서버 연결 오류(GET): ' + e.message); return null; }
  }
  async function apiPost(body){
    try{
      const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(body), cache: 'no-store' });
      return await res.json();
    }catch(e){ console.error(e); toast('서버 연결 오류(POST): ' + e.message); return null; }
  }

  async function loadSoloTeacherPin(){
    const res = await apiGet({ action:'teachers' });
    const map = res || {};
    return map[TID] ? map[TID].pin : null;
  }
  async function createSoloTeacher(pin){
    const res = await apiPost({ action:'saveTeacher', id:TID, name:'선생님', pin });
    return !!(res && res.ok);
  }
  async function resetSoloPin(newPin){
    const res = await apiPost({ action:'resetTeacherPin', id:TID, newPin });
    return !!(res && res.ok);
  }
  async function loadWorksheets(){
    const res = await apiGet({ action:'worksheets', teacherId:TID });
    const arr = res || [];
    arr.forEach(ws=>{
      ws.questions.forEach(q=>{
        if(typeof q.answer==='number' && !q.answers) q.answers=[q.answer];
        if(!q.answers) q.answers=[];
        if(typeof q.multi!=='boolean') q.multi = q.answers.length>1;
      });
    });
    return arr;
  }
  async function saveOneWorksheet(worksheet){
    const res = await apiPost({ action:'saveWorksheet', teacherId:TID, worksheet });
    return !!(res && res.ok);
  }
  async function deleteOneWorksheet(worksheetId){
    const res = await apiPost({ action:'deleteWorksheet', worksheetId });
    return !!(res && res.ok);
  }
  async function submitResult(worksheetId, result){
    const res = await apiPost({ action:'submitResult', teacherId:TID, worksheetId, result });
    return !!(res && res.ok);
  }
  async function loadResults(worksheetId){
    const res = await apiGet({ action:'results', teacherId:TID, worksheetId });
    const out = (res || []).map(r=>({ key:r.key, data:{ name:String(r.name==null?'':r.name), classroom:String(r.classroom==null?'':r.classroom), timestamp:r.timestamp, answers:r.answers, total:r.total, correctCount:r.correctCount } }));
    out.sort((a,b)=>(b.data.timestamp||0)-(a.data.timestamp||0));
    return out;
  }
  async function deleteAllResults(worksheetId){
    const res = await apiPost({ action:'deleteAllResults', teacherId:TID, worksheetId });
    return !!(res && res.ok);
  }
  async function deleteOneResult(key){
    const res = await apiPost({ action:'deleteResult', key });
    return !!(res && res.ok);
  }

  function markSVG(correct){
    if(correct) return '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="#E5484D" stroke-width="3.2"/></svg>';
    return '<svg viewBox="0 0 40 40"><line x1="9" y1="9" x2="31" y2="31" stroke="#E5484D" stroke-width="3.2" stroke-linecap="round"/><line x1="31" y1="9" x2="9" y2="31" stroke="#E5484D" stroke-width="3.2" stroke-linecap="round"/></svg>';
  }
  function footerLinkHTML(){ return '<div class="mg-footer-link"><a id="mg-teacher-link">⚙ 설정</a></div>'; }
  function bindFooterLink(){
    const el = document.getElementById('mg-teacher-link');
    if(el) el.addEventListener('click', ()=>{ loginPin=''; showResetForm=false; mode='pin'; render(); });
  }
  function updateBadge(){
    if(mode==='teacher' && loggedIn){
      badgeEl.innerHTML = '<a id="mg-logout">로그아웃</a>';
      const lo = document.getElementById('mg-logout');
      if(lo) lo.addEventListener('click', ()=>{ loggedIn=false; mode='student'; studentStep='pick-worksheet'; render(); });
    }else{
      badgeEl.innerHTML = '';
    }
  }

  // ================= STUDENT =================
  async function renderStudent(){
    updateBadge();

    if(studentStep==='pick-worksheet'){
      allWorksheets = await loadWorksheets();
      if(allWorksheets.length===0){
        root.innerHTML = '<div class="mg-card"><div class="mg-empty">아직 등록된 학습지가 없어요.<br>하단의 설정에서 먼저 학습지를 만들어주세요.</div></div>' + footerLinkHTML();
        bindFooterLink();
        return;
      }
      const btns = allWorksheets.map(ws=>`<button class="mg-list-btn" data-id="${ws.id}">${ws.title} <span class="arrow">›</span></button>`).join('');
      root.innerHTML = `<div class="mg-card"><h3>학습지를 선택하세요</h3>${btns}</div>` + footerLinkHTML();
      root.querySelectorAll('.mg-list-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          pickedWorksheet = allWorksheets.find(w=>w.id===btn.dataset.id);
          studentAnswers = {};
          selectedClassroom = ''; window.__mgTmpName = '';
          studentStep='quiz';
          renderStudent();
        });
      });
      bindFooterLink();
      return;
    }

    if(studentStep==='confirm'){
      const ws = pickedWorksheet;
      const rows = ws.questions.map(q=>{
        const chosen = (studentAnswers[q.no]||[]).slice().sort((a,b)=>a-b).join(', ');
        return `<div class="mg-stat-row"><div class="mg-stat-name">${q.no}번</div><div class="mg-stat-score">${chosen}번 선택</div></div>`;
      }).join('');
      root.innerHTML = `
        <div class="mg-card">
          <h3>제출 전 마지막 확인</h3>
          <div class="mg-warn">제출하면 바로 채점되고 다시 제출할 수 없어요. 고른 답이 맞는지 꼭 확인하세요!</div>
          <div class="mg-stat-row"><div class="mg-stat-name">${pendingClassroom}반</div><div class="mg-stat-score">${pendingName}</div></div>
          <div>${rows}</div>
        </div>
        <button class="mg-btn" id="mg-final-submit">최종 제출하기</button>
        <button class="mg-btn secondary" id="mg-back-edit" style="margin-top:8px;">다시 확인하기</button>
      `;
      document.getElementById('mg-back-edit').addEventListener('click', ()=>{ studentStep='quiz'; renderStudent(); });
      document.getElementById('mg-final-submit').addEventListener('click', async ()=>{
        const answers = ws.questions.map(q=>({
          no:q.no, chosen:(studentAnswers[q.no]||[]).slice(), answers:q.answers.slice()
        }));
        const correctCount = answers.filter(a=>sameSet(a.chosen,a.answers)).length;
        const result = { name:pendingName, classroom:pendingClassroom, timestamp:Date.now(), answers, total:answers.length, correctCount };
        const ok = await submitResult(ws.id, result);
        if(ok){
          window.__mgTmpName = '';
          lastResult = result;
          studentStep='result';
          renderStudent();
        }else{ toast('저장에 실패했어요. 다시 시도해주세요'); }
      });
      return;
    }

    if(studentStep==='result'){
      const r = lastResult;
      let stamps = r.answers.map(a=>{
        const correct = sameSet(a.chosen, a.answers);
        return '<div class="mg-stamp"><div class="mg-stamp-num">'+a.no+'번</div><div class="mg-mark">'+markSVG(correct)+'</div></div>';
      }).join('');
      root.innerHTML = `
        <div class="mg-card mg-result-screen">
          <div style="font-size:13px;color:var(--sub);font-weight:700;">${r.classroom}반 ${r.name} 학생 채점 결과</div>
          <div class="mg-result-score">${r.correctCount} / ${r.total}</div>
          <div class="mg-result-sub">정답률 ${Math.round(r.correctCount/r.total*100)}%</div>
          <div class="mg-stamp-grid">${stamps}</div>
          <button class="mg-btn secondary" id="mg-other-ws" style="margin-top:14px;">확인</button>
        </div>
      `;
      document.getElementById('mg-other-ws').addEventListener('click', ()=>{
        lastResult=null; studentAnswers={}; studentStep='pick-worksheet'; renderStudent();
      });
      return;
    }

    // quiz
    const ws = pickedWorksheet;
    const qhtml = ws.questions.map(q=>{
      const choices = [];
      const cur = studentAnswers[q.no] || [];
      const need = q.answers.length;
      for(let i=1;i<=ws.choiceCount;i++){
        const sel = cur.includes(i) ? 'selected' : '';
        choices.push(`<button class="mg-choice-btn ${sel}" data-no="${q.no}" data-val="${i}">${i}</button>`);
      }
      const countBadge = need>1 ? `<span class="mg-count-badge ${cur.length===need?'done':''}">(${cur.length}/${need})</span>` : '';
      return `<div class="mg-qrow"><div class="mg-qnum">${q.no}</div><div class="mg-choice-select">${choices.join('')}</div>${countBadge}</div>`;
    }).join('');

    root.innerHTML = `
      <div class="mg-card">
        <h3>${ws.title}</h3>
        <div class="mg-field">
          <label>반</label>
          <div class="mg-choice-select">${CLASSROOMS.map(c=>`<button class="mg-pick-btn ${selectedClassroom===c?'selected':''}" data-classroom="${c}">${c}</button>`).join('')}</div>
        </div>
        <div class="mg-field">
          <label>이름</label>
          <input type="text" id="mg-name" placeholder="이름을 입력하세요" value="${(window.__mgTmpName||'')}">
        </div>
        <div class="mg-note" style="margin-bottom:10px;">정답이 여러 개인 문제는 해당하는 보기를 모두 선택하세요.</div>
        <div>${qhtml}</div>
      </div>
      <button class="mg-btn" id="mg-submit">제출하기</button>
      <button class="mg-btn secondary" id="mg-back2" style="margin-top:8px;">다른 학습지 선택</button>
    `;

    root.querySelectorAll('[data-classroom]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        window.__mgTmpName = document.getElementById('mg-name').value;
        selectedClassroom = btn.dataset.classroom;
        renderStudent();
      });
    });
    root.querySelectorAll('.mg-choice-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        window.__mgTmpName = document.getElementById('mg-name').value;
        const no = btn.dataset.no;
        const val = parseInt(btn.dataset.val,10);
        const q = ws.questions.find(qq=>qq.no==no);
        const need = q.answers.length;
        const cur = studentAnswers[no] || [];
        const idx = cur.indexOf(val);
        if(idx>=0){ cur.splice(idx,1); }
        else{
          if(cur.length >= need){
            toast(need===1 ? '한 개만 선택할 수 있어요' : need+'개까지만 선택할 수 있어요');
            return;
          }
          cur.push(val);
        }
        studentAnswers[no] = cur;
        renderStudent();
      });
    });
    document.getElementById('mg-name').addEventListener('input', (e)=>{ window.__mgTmpName = e.target.value; });
    document.getElementById('mg-back2').addEventListener('click', ()=>{ studentStep='pick-worksheet'; renderStudent(); });

    document.getElementById('mg-submit').addEventListener('click', async ()=>{
      try{
        const name = (document.getElementById('mg-name').value || '').trim();
        if(!selectedClassroom){ toast('반을 선택해주세요'); return; }
        if(!name){ toast('이름을 입력해주세요'); return; }
        const answered = ws.questions.every(q => (studentAnswers[q.no]||[]).length===q.answers.length);
        if(!answered){ toast('모든 문제에 답을 다 선택해주세요'); return; }

        toast('확인 중...');
        const existing = await loadResults(ws.id);
        const dup = existing.some(r=>r.data.name.trim()===name && r.data.classroom===selectedClassroom);
        if(dup){ toast('이미 같은 반·이름으로 제출했어요. 다시 하려면 선생님께 요청하세요'); return; }

        pendingName = name;
        pendingClassroom = selectedClassroom;
        window.__mgTmpName = name;
        studentStep='confirm';
        renderStudent();
      }catch(err){
        toast('오류 발생: ' + (err && err.message ? err.message : String(err)));
      }
    });
  }

  // ================= LOGIN (single teacher) =================
  function renderPin(){
    updateBadge();
    const resetBlock = showResetForm ? `
      <div class="mg-note" style="margin:14px 0 8px; font-weight:700; color:var(--ink);">비밀번호 초기화</div>
      <div class="mg-field">
        <label>초기화 코드</label>
        <input type="password" id="mg-reset-code" placeholder="초기화 코드" value="${resetCode}">
      </div>
      <div class="mg-field">
        <label>새 비밀번호 (숫자 4자리)</label>
        <input type="password" id="mg-reset-newpin" placeholder="새 비밀번호 4자리" inputmode="numeric" maxlength="4" value="${resetNewPin}">
      </div>
      <button class="mg-btn secondary" id="mg-reset-go">초기화하고 로그인</button>
    ` : '';
    root.innerHTML = `
      <div class="mg-pin-wrap">
        <div class="mg-card">
          <h3>선생님 로그인</h3>
          <div class="mg-note" style="margin-bottom:12px;">비밀번호를 입력하세요. 처음이면 새로 만든 비밀번호로 등록돼요.</div>
          <div class="mg-field">
            <label>비밀번호 (숫자 4자리)</label>
            <input type="password" id="mg-login-pin" placeholder="4자리 숫자" inputmode="numeric" maxlength="4" value="${loginPin}">
          </div>
          <button class="mg-btn" id="mg-login-go">로그인</button>
          <button class="mg-btn secondary" id="mg-login-cancel" style="margin-top:8px;">취소</button>
          <div class="mg-footer-link" style="margin-top:14px;"><a id="mg-forgot-toggle">${showResetForm ? '초기화 취소' : '비밀번호를 잊으셨나요?'}</a></div>
          ${resetBlock}
        </div>
      </div>
    `;
    const pinEl = document.getElementById('mg-login-pin');
    pinEl.addEventListener('input', e=>{ loginPin = e.target.value.replace(/[^0-9]/g,'').slice(0,4); e.target.value = loginPin; });
    document.getElementById('mg-login-cancel').addEventListener('click', ()=>{ mode='student'; studentStep='pick-worksheet'; render(); });
    document.getElementById('mg-forgot-toggle').addEventListener('click', ()=>{
      showResetForm = !showResetForm; resetCode=''; resetNewPin='';
      renderPin();
    });
    document.getElementById('mg-login-go').addEventListener('click', async ()=>{
      if(loginPin.length!==4){ toast('비밀번호 4자리를 입력해주세요'); return; }
      const existingPin = await loadSoloTeacherPin();
      if(existingPin === null){
        const ok = await createSoloTeacher(loginPin);
        if(!ok){ toast('계정 생성에 실패했어요'); return; }
        toast('비밀번호가 등록됐어요');
      }else{
        if(String(existingPin) !== loginPin){ toast('비밀번호가 일치하지 않아요'); return; }
      }
      loggedIn = true;
      teacherWorksheets = await loadWorksheets();
      teacherTab='list';
      mode='teacher';
      render();
    });
    const resetCodeEl = document.getElementById('mg-reset-code');
    const resetPinEl = document.getElementById('mg-reset-newpin');
    if(resetCodeEl){
      resetCodeEl.addEventListener('input', e=>{ resetCode = e.target.value; });
      resetPinEl.addEventListener('input', e=>{ resetNewPin = e.target.value.replace(/[^0-9]/g,'').slice(0,4); e.target.value = resetNewPin; });
      document.getElementById('mg-reset-go').addEventListener('click', async ()=>{
        if(resetCode !== '1983'){ toast('초기화 코드가 올바르지 않아요'); return; }
        if(resetNewPin.length!==4){ toast('새 비밀번호 4자리를 입력해주세요'); return; }
        const existingPin = await loadSoloTeacherPin();
        let ok;
        if(existingPin === null) ok = await createSoloTeacher(resetNewPin);
        else ok = await resetSoloPin(resetNewPin);
        if(!ok){ toast('초기화에 실패했어요'); return; }
        toast('비밀번호가 초기화됐어요');
        loggedIn = true;
        showResetForm = false; resetCode=''; resetNewPin='';
        teacherWorksheets = await loadWorksheets();
        teacherTab='list';
        mode='teacher';
        render();
      });
    }
  }

  // ================= TEACHER =================
  function ensureDraft(existing){
    if(existing){
      draftKey = JSON.parse(JSON.stringify(existing));
      draftKey.questions.forEach(q=>{ if(typeof q.multi!=='boolean') q.multi = q.answers.length>1; });
    }else{
      draftKey = { id: genId('ws_'), title:'', choiceCount:4, questions: Array.from({length:10},(_,i)=>({no:i+1, answers:[1], multi:false})) };
    }
  }

  function renderTeacherList(){
    const body = document.getElementById('mg-teacher-body');
    if(teacherWorksheets.length===0){
      body.innerHTML = '<div class="mg-card"><div class="mg-empty">아직 만든 학습지가 없어요.</div></div>';
    }else{
      const html = teacherWorksheets.map(ws=>`
        <div class="mg-list-btn" style="cursor:default;">
          <span style="cursor:pointer;flex:1;" data-edit="${ws.id}">${ws.title} <span class="arrow">(${ws.questions.length}문항)</span></span>
          <button class="mg-btn small danger" data-del="${ws.id}" style="margin-left:8px;">삭제</button>
        </div>
      `).join('');
      body.innerHTML = `<div class="mg-card"><h3>내 학습지 목록</h3>${html}</div>`;
    }
    body.innerHTML += '<button class="mg-btn" id="mg-new-ws">+ 새 학습지 만들기</button>';
    body.querySelectorAll('[data-edit]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const ws = teacherWorksheets.find(w=>w.id===el.dataset.edit);
        ensureDraft(ws); teacherTab='edit'; renderTeacher();
      });
    });
    document.getElementById('mg-new-ws').addEventListener('click', ()=>{ ensureDraft(null); teacherTab='edit'; renderTeacher(); });
  }

  function renderTeacherEdit(){
    const body = document.getElementById('mg-teacher-body');
    const qrows = draftKey.questions.map(q=>{
      const choices = [];
      for(let i=1;i<=draftKey.choiceCount;i++){
        const sel = q.answers.includes(i) ? 'selected' : '';
        choices.push(`<button class="mg-choice-btn ${sel}" data-no="${q.no}" data-val="${i}">${i}</button>`);
      }
      return `<div class="mg-qrow">
        <div class="mg-qnum">${q.no}</div>
        <div class="mg-choice-select">${choices.join('')}</div>
        <label style="font-size:11.5px; color:var(--sub); font-weight:700; display:flex; align-items:center; gap:4px; cursor:pointer; margin-left:auto;">
          <input type="checkbox" class="mg-multi-check" data-no="${q.no}" ${q.multi?'checked':''}> 복수정답
        </label>
      </div>`;
    }).join('');

    body.innerHTML = `
      <div class="mg-card">
        <h3>학습지 정보</h3>
        <div class="mg-field">
          <label>학습지 제목</label>
          <input type="text" id="mg-t-title" placeholder="예: 분수 학습지" value="${draftKey.title || ''}">
        </div>
        <div class="mg-row">
          <div class="mg-field"><label>문항 수</label><input type="number" id="mg-t-qcount" min="1" max="40" value="${draftKey.questions.length}"></div>
          <div class="mg-field"><label>보기 개수</label><input type="number" id="mg-t-choicecount" min="2" max="9" value="${draftKey.choiceCount}"></div>
        </div>
      </div>
      <div class="mg-card">
        <h3>정답 입력</h3>
        <div class="mg-hint">"복수정답"을 체크한 문제만 보기를 여러 개 고를 수 있어요</div>
        <div>${qrows}</div>
      </div>
      <button class="mg-btn" id="mg-t-save">저장</button>
      <button class="mg-btn secondary" id="mg-t-cancel" style="margin-top:8px;">취소하고 목록으로</button>
    `;
    document.getElementById('mg-t-title').addEventListener('input', e=>{ draftKey.title = e.target.value; });
    document.getElementById('mg-t-qcount').addEventListener('change', e=>{
      let n = Math.max(1, Math.min(40, parseInt(e.target.value,10)||1));
      const cur = draftKey.questions;
      if(n>cur.length){ for(let i=cur.length+1;i<=n;i++) cur.push({no:i,answers:[1],multi:false}); }
      else{ draftKey.questions = cur.slice(0,n); }
      renderTeacherEdit();
    });
    document.getElementById('mg-t-choicecount').addEventListener('change', e=>{
      let n = Math.max(2, Math.min(9, parseInt(e.target.value,10)||2));
      draftKey.choiceCount = n;
      draftKey.questions.forEach(q=>{ q.answers=q.answers.filter(a=>a<=n); if(q.answers.length===0) q.answers=[1]; });
      renderTeacherEdit();
    });
    body.querySelectorAll('.mg-multi-check').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const no = parseInt(cb.dataset.no,10);
        const q = draftKey.questions.find(q=>q.no===no);
        if(q){
          q.multi = e.target.checked;
          if(!q.multi && q.answers.length>1){ q.answers = [q.answers[0]]; }
        }
        renderTeacherEdit();
      });
    });
    body.querySelectorAll('.mg-choice-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const no = parseInt(btn.dataset.no,10);
        const val = parseInt(btn.dataset.val,10);
        const q = draftKey.questions.find(q=>q.no===no);
        if(q){
          if(q.multi){
            const idx = q.answers.indexOf(val);
            if(idx>=0){ if(q.answers.length>1) q.answers.splice(idx,1); }
            else{ q.answers.push(val); }
          }else{
            q.answers = [val];
          }
        }
        renderTeacherEdit();
      });
    });
    document.getElementById('mg-t-save').addEventListener('click', async ()=>{
      if(!draftKey.title.trim()){ toast('학습지 제목을 입력해주세요'); return; }
      const ok = await saveOneWorksheet(draftKey);
      if(ok){
        const idx = teacherWorksheets.findIndex(w=>w.id===draftKey.id);
        if(idx>=0) teacherWorksheets[idx] = draftKey; else teacherWorksheets.push(draftKey);
        toast('저장되었습니다'); teacherTab='list'; renderTeacher();
      }else{ toast('저장에 실패했어요'); }
    });
    document.getElementById('mg-t-cancel').addEventListener('click', ()=>{ teacherTab='list'; renderTeacher(); });
  }

  let xlsxLoadPromise = null;
  function loadXlsxLib(){
    if(typeof XLSX !== 'undefined') return Promise.resolve(true);
    if(xlsxLoadPromise) return xlsxLoadPromise;
    xlsxLoadPromise = new Promise((resolve)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = ()=>resolve(true);
      s.onerror = ()=>resolve(false);
      setTimeout(()=>resolve(false), 8000); // 8초 안에 안 되면 포기
      document.head.appendChild(s);
    });
    return xlsxLoadPromise;
  }

  async function xlsxDownload(sheets, filename){
    toast('엑셀 준비 중...');
    const ok = await loadXlsxLib();
    if(!ok || typeof XLSX === 'undefined'){ toast('엑셀 기능을 불러오지 못했어요 (네트워크 문제일 수 있어요)'); return; }
    const wb = XLSX.utils.book_new();
    sheets.forEach(s=>{ const ws = XLSX.utils.json_to_sheet(s.rows); XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0,31)); });
    XLSX.writeFile(wb, filename);
  }

  async function renderTeacherResults(){
    const body = document.getElementById('mg-teacher-body');
    if(teacherWorksheets.length===0){
      body.innerHTML = '<div class="mg-card"><div class="mg-empty">먼저 학습지를 만들어주세요.</div></div>';
      return;
    }
    if(!resultsWorksheetId) resultsWorksheetId = teacherWorksheets[0].id;
    const wsButtons = teacherWorksheets.map(ws=>{
      const active = ws.id===resultsWorksheetId ? 'active' : '';
      return `<div class="mg-tab ${active}" data-ws="${ws.id}">${ws.title}</div>`;
    }).join('');
    body.innerHTML = `<div class="mg-tabs" style="flex-wrap:wrap;">${wsButtons}</div><div id="mg-results-body"></div>`;
    body.querySelectorAll('[data-ws]').forEach(el=>{ el.addEventListener('click', ()=>{ resultsWorksheetId = el.dataset.ws; renderTeacherResults(); }); });

    const resultsBody = document.getElementById('mg-results-body');
    resultsBody.innerHTML = '<div class="mg-card"><div class="mg-empty">불러오는 중...</div></div>';
    const ws = teacherWorksheets.find(w=>w.id===resultsWorksheetId);
    const results = await loadResults(resultsWorksheetId);

    if(results.length===0){
      resultsBody.innerHTML = '<div class="mg-card"><div class="mg-empty">아직 제출된 채점 결과가 없어요.</div></div>';
      return;
    }

    const studentRows = results.map((r,i)=>{
      const d = r.data;
      const pct = Math.round(d.correctCount/d.total*100);
      const pctClass = pct>=80?'mg-pct-high':(pct>=50?'mg-pct-mid':'mg-pct-low');
      const dt = new Date(d.timestamp);
      const timeStr = dt.getMonth()+1+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
      const cls = (d.classroom?d.classroom+'반':'');
      return `<div class="mg-stat-row">
        <div>
          <div class="mg-stat-name">${d.name} <span style="font-weight:400;color:var(--sub);font-size:12px;">${cls}</span></div>
          <div class="mg-stat-score">${d.correctCount}/${d.total}문항 · ${timeStr}</div>
        </div>
        <button class="mg-btn small secondary" data-indiv="${i}">엑셀</button>
        <button class="mg-btn small danger" data-resetone="${r.key}">제출 초기화</button>
        <div class="mg-pct-badge ${pctClass}">${pct}%</div>
      </div>`;
    }).join('');

    const itemMap = {};
    results.forEach(r=>{
      r.data.answers.forEach(a=>{
        if(!itemMap[a.no]) itemMap[a.no] = {correct:0, total:0, answers:a.answers};
        itemMap[a.no].total++;
        if(sameSet(a.chosen,a.answers)) itemMap[a.no].correct++;
      });
    });
    const itemNos = Object.keys(itemMap).map(n=>parseInt(n,10)).sort((a,b)=>a-b);
    const itemBars = itemNos.map(no=>{
      const it = itemMap[no];
      const pct = Math.round(it.correct/it.total*100);
      return `<div class="mg-item-bar-wrap">
        <div class="mg-item-bar-label"><span>${no}번</span><span>${pct}% (${it.correct}/${it.total})</span></div>
        <div class="mg-item-bar-track"><div class="mg-item-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');

    resultsBody.innerHTML = `
      <div class="mg-card"><h3>학생별 결과 (${results.length}건 제출)</h3><div>${studentRows}</div></div>
      <div class="mg-card"><h3>문항별 정답률</h3>${itemBars}</div>
      <button class="mg-btn secondary" id="mg-export-all">전체 결과 엑셀 다운로드</button>
      <button class="mg-btn danger" id="mg-reset" style="margin-top:8px;">전체 결과 초기화</button>
      <div id="mg-reset-confirm" style="display:none; margin-top:10px;">
        <div class="mg-note" style="color:var(--red-pen); font-weight:700; margin-bottom:8px;">모든 학생의 채점 결과를 삭제할까요? 되돌릴 수 없어요.</div>
        <div class="mg-row"><button class="mg-btn danger" id="mg-reset-yes">삭제하기</button><button class="mg-btn secondary" id="mg-reset-no">취소</button></div>
      </div>
    `;

    resultsBody.querySelectorAll('[data-indiv]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const r = results[parseInt(btn.dataset.indiv,10)].data;
        const rows = r.answers.map(a=>({ 문항번호:a.no, 학생답:a.chosen.join(','), 정답:a.answers.join(','), 정답여부: sameSet(a.chosen,a.answers)?'O':'X' }));
        xlsxDownload([{name:r.name, rows}], ws.title+'_'+(r.classroom||'')+'_'+r.name+'_결과.xlsx');
      });
    });
    document.getElementById('mg-export-all').addEventListener('click', ()=>{
      const studentSheet = results.map(r=>({
        반:r.data.classroom||'', 이름:r.data.name,
        점수:r.data.correctCount+'/'+r.data.total,
        정답률:Math.round(r.data.correctCount/r.data.total*100)+'%',
        제출시간:new Date(r.data.timestamp).toLocaleString('ko-KR')
      })).sort((a,b)=>{
        if(a.반!==b.반) return a.반.localeCompare(b.반);
        return a.이름.localeCompare(b.이름);
      });
      const itemSheet = itemNos.map(no=>{
        const it = itemMap[no];
        return { 문항번호:no, 정답:it.answers.join(','), 정답자수:it.correct, 전체인원:it.total, 정답률:Math.round(it.correct/it.total*100)+'%' };
      });
      xlsxDownload([{name:'학생별 결과', rows:studentSheet},{name:'문항별 정답률', rows:itemSheet}], ws.title+'_전체결과.xlsx');
    });
    document.getElementById('mg-reset').addEventListener('click', ()=>{
      document.getElementById('mg-reset').style.display='none';
      document.getElementById('mg-reset-confirm').style.display='block';
    });
    document.getElementById('mg-reset-no').addEventListener('click', ()=>{ renderTeacherResults(); });
    document.getElementById('mg-reset-yes').addEventListener('click', async ()=>{
      const ok = await deleteAllResults(resultsWorksheetId);
      if(ok){ toast('초기화되었습니다'); renderTeacherResults(); }
      else{ toast('초기화에 실패했어요'); renderTeacherResults(); }
    });
  }

  function renderTeacher(){
    updateBadge();
    root.innerHTML = `
      <div class="mg-tabs">
        <div class="mg-tab ${teacherTab==='list'||teacherTab==='edit'?'active':''}" id="mg-tt-list">학습지 관리</div>
        <div class="mg-tab ${teacherTab==='results'?'active':''}" id="mg-tt-results">채점 결과</div>
      </div>
      <div id="mg-teacher-body"></div>
    `;
    document.getElementById('mg-tt-list').addEventListener('click', ()=>{ teacherTab='list'; renderTeacher(); });
    document.getElementById('mg-tt-results').addEventListener('click', ()=>{ teacherTab='results'; renderTeacher(); });
    if(teacherTab==='list') renderTeacherList();
    else if(teacherTab==='edit') renderTeacherEdit();
    else renderTeacherResults();
  }

  document.addEventListener('click', async (e)=>{
    if(e.target.matches('[data-del]')){
      const id = e.target.dataset.del;
      if(e.target.dataset.armed==='1'){
        const ok = await deleteOneWorksheet(id);
        if(ok){
          teacherWorksheets = teacherWorksheets.filter(w=>w.id!==id);
          toast('삭제되었습니다');
          renderTeacher();
        }else{ toast('삭제에 실패했어요'); }
      }else{
        e.target.dataset.armed='1'; e.target.textContent='정말 삭제?';
        setTimeout(()=>{ e.target.dataset.armed='0'; e.target.textContent='삭제'; }, 2500);
      }
    }
    if(e.target.matches('[data-resetone]')){
      const key = e.target.dataset.resetone;
      if(e.target.dataset.armed==='1'){
        const ok = await deleteOneResult(key);
        if(ok){ toast('해당 학생 제출이 초기화되었어요'); renderTeacherResults(); }
        else{ toast('초기화에 실패했어요'); }
      }else{
        e.target.dataset.armed='1'; e.target.textContent='정말 초기화?';
        setTimeout(()=>{ if(e.target){ e.target.dataset.armed='0'; e.target.textContent='제출 초기화'; } }, 2500);
      }
    }
  });

  function render(){
    if(mode==='student') renderStudent();
    else if(mode==='pin') renderPin();
    else renderTeacher();
  }

  render();
})();
</script>
